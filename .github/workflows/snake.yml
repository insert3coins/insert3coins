# Place this file at: .github/workflows/snake.yml
# in the insert3coins/insert3coins repo.
#
# After committing: Actions tab -> "Generate Snake" -> Run workflow
# It creates an "output" branch containing snake.svg, which the README links to.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%2321E6C1&color_dots=%231A0B2E,%233d2a5c,%23ff4f9a,%23ffb24d,%2321e6c1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
