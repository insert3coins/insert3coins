  <line x1="22" y1="45" x2="398" y2="45" stroke="#6E5A8A" stroke-width="1" opacity="0.5"/>

  <text x="26" y="72" font-family="'Share Tech Mono','Consolas','Courier New',monospace" font-size="11.5" fill="#C9D1D9">Native Windows companion for Elite Dangerous with</text>
  <text x="26" y="89" font-family="'Share Tech Mono','Consolas','Courier New',monospace" font-size="11.5" fill="#C9D1D9">live journal tracking, exploration, trade, fleet and</text>
  <text x="26" y="106" font-family="'Share Tech Mono','Consolas','Courier New',monospace" font-size="11.5" fill="#C9D1D9">engineering tools, HUD overlays</text>
  <circle cx="31" cy="116" r="5" fill="#3572A5"/>
  <text x="43" y="120" font-family="'Share Tech Mono','Consolas','Courier New',monospace" font-size="11" fill="#C9D1D9">Python</text>
