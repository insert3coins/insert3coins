<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140"
     viewBox="0 0 420 140" role="img" aria-label="&gt; VOIDCOMPASS">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21E6C1"/>
      <stop offset="55%" stop-color="#FF4F9A"/>
      <stop offset="100%" stop-color="#FFB24D"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#21E6C1" opacity="0.035"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="1" y="1" width="418" height="138" rx="10"
        fill="#0D0619" stroke="url(#edge)" stroke-width="2"/>
